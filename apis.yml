- name: BIM 360 Locations API
  description: >
    Manages and shares the hierarchy of building areas within construction projects. Provides programmatic
    access to location trees used to organize and contextualize issues, assets, and other project data
    by physical location.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
