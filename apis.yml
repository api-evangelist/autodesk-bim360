- name: BIM 360 Account Admin API
  description: >
    Automates setting up projects, assigning project admins, managing member and partner company directories,
    and synchronizing data with external systems. Enables programmatic control of BIM 360 account-level
    administration tasks.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://aps.autodesk.com/en/docs/bim360/v1/tutorials/account-admin
  baseURL: https://developer.api.autodesk.com
  tags:
  - Account Administration
  - Project Setup
  - Member Management
  properties:
  - type: Documentation
    url: https://aps.autodesk.com/en/docs/bim360/v1/tutorials/account-admin
- name: BIM 360 Issues API
  description: >
    Creates, tracks, and updates issues within BIM 360 projects. Issues are items created for tracking,
    managing, and communicating problems and other points of concern through to resolution. Version 2
    of the API simplifies the response format and provides additional features such as local attachments.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://aps.autodesk.com/en/docs/bim360/v1/overview/field-guide/issues
  baseURL: https://developer.api.autodesk.com
  tags:
  - Issues
  - Tracking
  - Quality Control
  properties:
  - type: Documentation
    url: https://aps.autodesk.com/en/docs/bim360/v1/overview/field-guide/issues
- name: BIM 360 Document Management API
  description: >
    Connects BIM APIs to access, upload, and share 2D plans, 3D BIM models, and any other project documents
    to maximize collaboration. Provides programmatic access to BIM 360 Docs for document storage and version
    control.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://aps.autodesk.com/en/docs/bim360/v1/tutorials/getting-started/manage-access-to-docs/
  baseURL: https://developer.api.autodesk.com
